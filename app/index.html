<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MEDDPICC Editor</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="print.css" media="print">
</head>
<body>
  <header class="app-header">
    <input id="title" class="title-input" type="text" placeholder="Untitled opportunity"
           aria-label="Opportunity title" autocomplete="off" spellcheck="true">
    <h1 id="print-title" class="print-only"></h1>
  </header>

  <div class="command-bar">
    <div class="command-bar-inner">
      <div class="file-actions">
        <button type="button" id="btn-new" class="btn">New</button>
        <button type="button" id="btn-open" class="btn">Open&hellip;</button>
        <button type="button" id="btn-download" class="btn btn-primary">Download</button>
      </div>

      <div id="format-toolbar" class="format-toolbar is-inactive" role="toolbar" aria-label="Text formatting">
        <button type="button" class="tool" data-command="bold" data-label="Bold" data-shortcut="B" aria-pressed="false">
          <span class="tool-glyph tool-bold">B</span>
        </button>
        <button type="button" class="tool" data-command="italic" data-label="Italic" data-shortcut="I" aria-pressed="false">
          <span class="tool-glyph tool-italic">I</span>
        </button>
        <button type="button" class="tool" data-command="underline" data-label="Underline" data-shortcut="U" aria-pressed="false">
          <span class="tool-glyph tool-underline">U</span>
        </button>
        <span class="tool-sep" aria-hidden="true"></span>
        <button type="button" class="tool" data-command="link" data-label="Link" data-shortcut="K" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </button>
        <span class="tool-sep" aria-hidden="true"></span>
        <button type="button" class="tool" data-command="insertUnorderedList" data-label="Bulleted list" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/><line x1="4" y1="6" x2="4.01" y2="6"/><line x1="4" y1="12" x2="4.01" y2="12"/><line x1="4" y1="18" x2="4.01" y2="18"/></svg>
        </button>
        <button type="button" class="tool" data-command="insertOrderedList" data-label="Numbered list" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>
        </button>
      </div>

      <div id="summary-strip" class="summary-strip" role="group" aria-label="Status summary"></div>

      <div class="save-status" aria-live="polite">
        <span id="storage-state" class="storage-state"></span>
        <span id="download-state" class="download-state"></span>
      </div>
    </div>
  </div>

  <div id="storage-banner" class="banner banner-warn" role="alert" hidden>
    Browser storage is unavailable, so this page can't keep a working copy if the tab closes.
    Download regularly to avoid losing work.
  </div>
  <div id="tab-banner" class="banner banner-info" hidden>
    <span>The editor is also open in another tab. Edits in either tab overwrite the copy saved in this browser.</span>
    <button type="button" class="btn btn-small">Dismiss</button>
  </div>

  <main>
    <div id="next-steps-slot"></div>
    <div id="sections"></div>
  </main>

  <div id="link-popover" class="link-popover" role="dialog" aria-label="Edit link" hidden>
    <form novalidate>
      <label for="link-url" class="link-label">Link address</label>
      <input id="link-url" type="text" inputmode="url" autocomplete="off" spellcheck="false"
             placeholder="https://example.com">
      <p class="link-error" role="alert" hidden></p>
      <div class="link-actions">
        <button type="submit" class="btn btn-primary btn-small">Apply</button>
        <button type="button" class="btn btn-small" data-action="remove">Remove link</button>
        <button type="button" class="btn btn-small" data-action="cancel">Cancel</button>
      </div>
    </form>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <input id="file-input" type="file" accept=".json,application/json" hidden>
  <noscript><p class="banner banner-warn">This editor needs JavaScript to run.</p></noscript>

  <!-- Classic scripts (not ES modules) so the page works when opened from file://. Order matters. -->
  <script src="js/config.js"></script>
  <script src="js/sanitize.js"></script>
  <script src="js/document.js"></script>
  <script src="js/persistence.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
